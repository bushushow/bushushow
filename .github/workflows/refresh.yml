name: refresh profile heatmap

on:
  schedule:
    # her gun 03:17 UTC (Turkiye saatiyle 06:17)
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/make_heatmap.py"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Rebuild heatmap
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/make_heatmap.py --user ${{ github.repository_owner }} --out assets/heatmap.svg

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain assets/heatmap.svg)" ]]; then
            git add assets/heatmap.svg
            git commit -m "chore: refresh contribution heatmap"
            git push
          else
            echo "degisiklik yok"
          fi
